id: io.github.Alastt28.AdbGUI
branch: beta
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: adbgui

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all

modules:
  - name: adb-binary
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp adb /app/bin/adb
    sources:
      - type: archive
        url: https://dl.google.com/android/repository/platform-tools_r37.0.0-linux.zip
        sha256: 198ae156ab285fa555987219af237b31102fefe8b9d2bc274708a8d4f2865a07

  - name: pyside6
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir PySide6-Essentials
      - rm -rf /app/lib/python3.13/site-packages/PySide6/Qt/lib/
      - rm -rf /app/lib/python3.13/site-packages/PySide6/Qt/plugins/

  - name: adbgui
    buildsystem: meson
    sources:
      - type: dir
        path: .